# Runs the same structural validation as `npm run validate` locally.
# Cloud execution is optional: the repository does not rely on paid Actions minutes, so local
# validation is the source of truth. The workflow stays ready to use whenever Actions is enabled.
#
# Third-party actions are pinned to full commit SHAs (the commit the v4 tag pointed to when pinned).
# To update: resolve the new release tag to its commit SHA from the official repository and update
# both the SHA and the version comment.
name: Validate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate prompts, translations, links and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (prompts, translations, links, generated files)
        run: npm run validate
